name: Build APK

# Manual-only: shows a "Run workflow" button in the repo's Actions tab (web UI).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        type: choice
        default: release
        options: [release, debug]
      build_number:
        description: "Optional build number (overrides pubspec +N)"
        type: string
        required: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # The repo only tracks the web/ platform, so generate the Android project
      # scaffolding on the fly. Idempotent: only adds files that are missing.
      - name: Generate Android platform files
        run: flutter create --project-name paycheck_analyzer --org com.mikyll --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      # The Flutter template scaffolds AGP 9 + Gradle 9 but ships
      # android.builtInKotlin=false, so plugins are expected to apply Kotlin
      # themselves. file_picker 11.0.2 instead assumes AGP >= 9 means built-in
      # Kotlin and SKIPS applying KGP, so FilePickerPlugin.kt never compiles ->
      # "cannot find symbol FilePickerPlugin". Two edits fix it:
      #   1. Force its legacy path (isAgp9OrAbove=false) so it applies KGP.
      #   2. Bump the Kotlin it bundles (1.8.22, incompatible with Gradle 9) to
      #      the version the Flutter template pins, so the .kt actually compiles.
      # Verified locally producing a release APK. See flutter_file_picker #2002.
      - name: Patch file_picker for AGP 9 / Gradle 9 (KGP fix)
        run: |
          set -euo pipefail
          kv="$(grep -oE 'kotlin\.android"\) version "[^"]+"' android/settings.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          [ -n "$kv" ] || { echo "could not detect project Kotlin version"; exit 1; }
          fp="$(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" -maxdepth 3 -type d -name 'file_picker-*' | sort | tail -1)"
          [ -n "$fp" ] || { echo "file_picker not found in pub cache"; exit 1; }
          gradle="$fp/android/build.gradle"
          sed -i "s/def isAgp9OrAbove = .*/def isAgp9OrAbove = false/" "$gradle"
          sed -i "s/kotlin_version = '[^']*'/kotlin_version = '$kv'/" "$gradle"
          echo "Patched $gradle (project Kotlin $kv):"
          grep -nE "kotlin_version|isAgp9OrAbove" "$gradle"

      - name: Build APK
        run: |
          FLAGS="--${{ inputs.mode }}"
          if [ -n "${{ inputs.build_number }}" ]; then
            FLAGS="$FLAGS --build-number=${{ inputs.build_number }}"
          fi
          echo "flutter build apk $FLAGS"
          flutter build apk $FLAGS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paycheck-analyzer-${{ inputs.mode }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.mode }}.apk
          if-no-files-found: error
          retention-days: 30
